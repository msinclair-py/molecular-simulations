[build-system]
requires = ['hatchling']
build-backend = 'hatchling.build'

[project]
name = 'molecular_simulations'
version = "0.5.1"
authors = [
  { name='Matt Sinclair', email='msinclair@anl.gov' },
]
description = '''
A small package for building molecular systems using the AMBER \
force field and deploying OpenMM simulations on HPC clusters using Parsl.
'''
readme = 'README.md'
requires-python = '>= 3.10'
classifiers = [
    'Programming Language :: Python :: 3',
]
license = 'MIT'
license-files = ['LICEN[CS]E*']
dependencies = [
    'pdbfixer',
    'MDAnalysis>=2.7',
    'mdtraj',
    'natsort',
    'numba',
    'numpy>=2.0',
    'openmm>=8.0',
    'parmed',
    'parsl>=2024.1.29',
    'polars',
    'pydantic',
    'python-json-logger>=3',
    'pyyaml',
    'rust-simulation-tools>=0.2.5',
    'scikit-learn',
    'seaborn'
]

[project.urls]
Homepage = 'https://github.com/msinclair-py/molecular-simulations'
Issues = 'https://github.com/msinclair-py/molecular-simulations/issues'

[project.optional-dependencies]
ligand = [
    'openbabel',
    'rdkit'
]
docs = [
    'sphinx',
    'sphinx-rtd-theme',
    'sphinx-wagtail-theme',
    'sphinx-autodoc-typehints',
    'myst-parser',
    'docutils'
]
dev = [
    'pytest>=7.0',
    'coverage[toml]>=7.0',
    'numpy>=2.0',
    'ruff>=0.15',
    'pre-commit>=3.5',
    'gemmi',
]

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ['src/molecular_simulations']

[tool.pytest.ini_options]
addopts = '-q --maxfail=1'
filterwarnings = [
    'ignore::DeprecationWarning:importlib._bootstrap',
]
testpaths = ['tests']
markers = [
    'slow: potentially long-running test',
    'requires_openmm: needs OpenMM runtime',
    'requires_amber: needs AmberTools/tleap',
    'requires_rdkit: needs RDKit installation',
    'integration: end-to-end integration test',
    'unit: isolated unit test',
]

[tool.ruff]
target-version = 'py310'
line-length = 88
src = ['src', 'tests']

[tool.ruff.lint]
select = [
    'E',      # pycodestyle errors
    'W',      # pycodestyle warnings
    'F',      # pyflakes
    'I',      # isort
    'N',      # pep8-naming
    'UP',     # pyupgrade
    'B',      # flake8-bugbear
    'SIM',    # flake8-simplify
    'TCH',    # flake8-type-checking
    'RUF',    # ruff-specific rules
]
ignore = [
    'E501',   # line too long (formatter handles this)
    'N802',   # lowercase function name (compute_at_pH, load_pLDDT, etc.)
    'N803',   # lowercase argument name (X for data matrices, etc.)
    'N806',   # lowercase variable in function (pH, X, etc.)
    'N813',   # ignore import alias case (MDAnalysis -> mda)
]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]  # re-exports in __init__ are intentional
# Nested `with patch(...)` blocks are idiomatic and readable in tests.
"tests/**" = ["SIM117"]

[tool.ruff.lint.isort]
known-first-party = ['molecular_simulations']

[tool.ruff.format]
docstring-code-format = true
quote-style = 'single'  # preserve the project's existing single-quote style

[tool.coverage.run]
source = ['src/molecular_simulations']
branch = true

[tool.coverage.report]
show_missing = true
# Exclude code that is not meant to be reached by the unit suite so the metric
# reflects real, testable code rather than rewarding dead lines.
exclude_lines = [
    'pragma: no cover',
    'if __name__ == .__main__.:',
    'raise NotImplementedError',
    'raise AssertionError',
    '@(abc\.)?abstractmethod',
    'if TYPE_CHECKING:',
]
# Abstract-method bodies are just a bare ``...`` or ``pass``; drop them too.
exclude_also = [
    '^\s*\.\.\.\s*$',
]

[tool.ty]
