name: CI

on:
  pull_request:
    branches: [develop, main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.10'
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install dev dependencies
        run: pip install -e '.[dev]'

      - name: Cache pre-commit environments
        uses: actions/cache@v6
        with:
          path: ~/.cache/pre-commit
          key: pre-commit-${{ runner.os }}-${{ hashFiles('.pre-commit-config.yaml') }}

      - name: Run pre-commit (ruff, mypy, codespell, ...)
        run: pre-commit run --all-files --show-diff-on-failure

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install package and test deps
        run: pip install -e '.[dev]'

      - name: Run tests with coverage
        run: |
          coverage run -m pytest
          coverage report
          coverage xml

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}

  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install docs dependencies
        run: pip install -e '.[docs]'

      - name: Build site (strict)
        run: sphinx-build -W -b html docs docs/_build/html

  skills-e2e:
    runs-on: ubuntu-latest
    env:
      # Dummy key: each session fails authentication after skill discovery,
      # which is all this job checks. Nothing is billed.
      ANTHROPIC_API_KEY: sk-ant-dummy-ci-key
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Build the wheel and install it like a user
        run: |
          pip install build
          python -m build --wheel
          python -m venv "$RUNNER_TEMP/user"
          "$RUNNER_TEMP/user/bin/pip" install dist/*.whl
          echo "$RUNNER_TEMP/user/bin" >> "$GITHUB_PATH"

      - name: Install Claude Code and Codex
        # Codex is pinned: the check reads `codex debug prompt-input`, a debug
        # command whose output may change between releases.
        run: npm install -g @anthropic-ai/claude-code @openai/codex@0.166.0

      - name: Check that Claude Code and Codex discover every skill install route
        run: .github/scripts/skills_e2e.sh
