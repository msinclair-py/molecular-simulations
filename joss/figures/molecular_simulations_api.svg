<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="460" viewBox="0 0 1000 460" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" role="img" aria-label="Single Python API for molecular simulations, organized in three stages — build, simulate, analyze — running on a Parsl execution layer.">
  <rect x="0" y="0" width="1000" height="460" fill="#ffffff"/>

  <!-- Header -->
  <text x="32" y="48" font-size="24" font-weight="600" fill="#1f2328" letter-spacing="-0.3">Single Python API</text>
  <text x="32" y="74" font-size="15" fill="#565d66">One interface for building, running, and analyzing molecular simulations</text>
  <line x1="32" y1="92" x2="968" y2="92" stroke="#e2e4e8" stroke-width="1"/>

  <!-- Arrows between columns -->
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#9aa0a8" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>
  <line x1="322" y1="236" x2="352" y2="236" stroke="#9aa0a8" stroke-width="1.5" marker-end="url(#ar)"/>
  <line x1="647" y1="236" x2="677" y2="236" stroke="#9aa0a8" stroke-width="1.5" marker-end="url(#ar)"/>

  <!-- BUILD -->
  <rect x="32" y="116" width="285" height="240" rx="10" fill="none" stroke="#e2e4e8" stroke-width="1"/>
  <circle cx="54" cy="146" r="4" fill="#185FA5"/>
  <text x="66" y="151" font-size="16" font-weight="600" fill="#185FA5">Build</text>
  <text x="50" y="172" font-size="12.5" fill="#8a9099">Prepare molecular systems</text>
  <line x1="48" y1="186" x2="301" y2="186" stroke="#eef0f2" stroke-width="1"/>
  <g font-size="13" fill="#565d66">
    <circle cx="52" cy="204" r="1.8" fill="#b7bcc3"/><text x="64" y="208">Explicit / implicit solvent</text>
    <circle cx="52" cy="230" r="1.8" fill="#b7bcc3"/><text x="64" y="234">Ligand parameterization (GAFF2)</text>
    <circle cx="52" cy="256" r="1.8" fill="#b7bcc3"/><text x="64" y="260">Complex assembly</text>
    <circle cx="52" cy="282" r="1.8" fill="#b7bcc3"/><text x="64" y="286">Constant-pH-ready systems</text>
    <circle cx="52" cy="308" r="1.8" fill="#b7bcc3"/><text x="64" y="312">Coarse-grained (CALVADOS)</text>
  </g>

  <!-- SIMULATE -->
  <rect x="357" y="116" width="285" height="240" rx="10" fill="none" stroke="#e2e4e8" stroke-width="1"/>
  <circle cx="379" cy="146" r="4" fill="#0F6E56"/>
  <text x="391" y="151" font-size="16" font-weight="600" fill="#0F6E56">Simulate</text>
  <text x="375" y="172" font-size="12.5" fill="#8a9099">Run and control simulations</text>
  <line x1="373" y1="186" x2="626" y2="186" stroke="#eef0f2" stroke-width="1"/>
  <g font-size="13" fill="#565d66">
    <circle cx="377" cy="204" r="1.8" fill="#b7bcc3"/><text x="389" y="208">Equilibration / production</text>
    <circle cx="377" cy="230" r="1.8" fill="#b7bcc3"/><text x="389" y="234">Checkpoint / restart</text>
    <circle cx="377" cy="256" r="1.8" fill="#b7bcc3"/><text x="389" y="260">Custom forces</text>
    <circle cx="377" cy="282" r="1.8" fill="#b7bcc3"/><text x="389" y="286">Constant-pH MD</text>
    <circle cx="377" cy="308" r="1.8" fill="#b7bcc3"/><text x="389" y="312">EVB free energy</text>
    <circle cx="377" cy="334" r="1.8" fill="#b7bcc3"/><text x="389" y="338">Umbrella sampling</text>
  </g>

  <!-- ANALYZE -->
  <rect x="682" y="116" width="285" height="240" rx="10" fill="none" stroke="#e2e4e8" stroke-width="1"/>
  <circle cx="704" cy="146" r="4" fill="#993C1D"/>
  <text x="716" y="151" font-size="16" font-weight="600" fill="#993C1D">Analyze</text>
  <text x="700" y="172" font-size="12.5" fill="#8a9099">Extract insights from data</text>
  <line x1="698" y1="186" x2="951" y2="186" stroke="#eef0f2" stroke-width="1"/>
  <g font-size="13" fill="#565d66">
    <circle cx="702" cy="204" r="1.8" fill="#b7bcc3"/><text x="714" y="208">Conformational clustering</text>
    <circle cx="702" cy="230" r="1.8" fill="#b7bcc3"/><text x="714" y="234">Interaction-energy fingerprints</text>
    <circle cx="702" cy="256" r="1.8" fill="#b7bcc3"/><text x="714" y="260">Covariance-based PPI</text>
    <circle cx="702" cy="282" r="1.8" fill="#b7bcc3"/><text x="714" y="286">MM-PBSA (parallel)</text>
    <circle cx="702" cy="308" r="1.8" fill="#b7bcc3"/><text x="714" y="312">SASA</text>
    <circle cx="702" cy="334" r="1.8" fill="#b7bcc3"/><text x="714" y="338">Interface scoring (ipSAE / pDockQ)</text>
  </g>

  <!-- Parsl footer -->
  <rect x="32" y="380" width="935" height="48" rx="10" fill="none" stroke="#e2e4e8" stroke-width="1"/>
  <text x="50" y="409" font-size="14" font-weight="600" fill="#1f2328">Parsl execution layer</text>
  <text x="210" y="409" font-size="13" fill="#565d66">Scalable execution across environments</text>
  <text x="949" y="409" font-size="13" fill="#8a9099" text-anchor="end">laptop &#183; PBS / SLURM &#183; cloud</text>
</svg>
